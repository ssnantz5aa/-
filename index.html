<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211b17" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="받은 일정 메시지를 붙여넣으면 날짜, 시간, 장소, 연락처, 페이를 정리해 캘린더에 등록합니다.">
  <title>Slate · 일정</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/app.css?v=20261103">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="주요 메뉴"></nav>
  </div>
  <div id="toast" class="toast-host" aria-live="polite"></div>
  <div id="sheet" class="sheet-host"></div>
  <noscript><p style="padding:24px">이 앱을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
  <script>
    // 모듈을 못 읽는 오래된 브라우저나 오류가 나면 빈 화면 대신 안내를 보여 준다.
    window.addEventListener('error', function (e) {
      var v = document.getElementById('view');
      if (v && !v.children.length) v.innerHTML = '<p style="padding:24px;line-height:1.6">화면을 불러오지 못했어요. 사파리나 크롬 최신 버전에서 다시 열어 주세요.<br><small>' + (e.message || '') + '</small></p>';
    }, true);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
